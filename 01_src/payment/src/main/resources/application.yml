spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:mysql://localhost:3306/payment?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: payment
    password: payment
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      # 스키마는 Flyway가 단독 관리. 엔티티-스키마 정합성은 Testcontainers 통합테스트로 검증.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      enable-auto-commit: false

# 애플리케이션 고유 설정 (설계 9-4, 6-3 값 반영)
app:
  pg:
    timeout-ms: 3000           # 내부/PG 호출 timeout (설계 6-2)
  correction:
    # PG 호출 불확실성 보정 배치: 30초 주기, 1분 유예 (설계 6-3)
    payment-fixed-delay-ms: 30000
    grace-period-seconds: 60
  kafka-republish:
    fixed-delay-ms: 60000      # kafka_publish_failures 재발행 (설계 10-5)

logging:
  level:
    com.payment: debug
